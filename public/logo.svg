<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <!-- Helmet Gradient -->
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <!-- Building/Grid Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid Grid Lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="2">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Abstract Construction Crane/Structure Base Structure -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="4" fill="none">
    <path d="M120 400 L256 120 L392 400 Z" />
    <line x1="120" y1="400" x2="392" y2="400" />
    <line x1="256" y1="120" x2="256" y2="400" />
  </g>

  <!-- The Icon Emblem: Modern Solar House & Tech Hammer / Gear -->
  <g transform="translate(136, 126)">
    <!-- House/Building outline -->
    <path d="M20 160 L120 70 L220 160 L220 220 C220 231 211 240 200 240 L40 240 C29 240 20 231 20 220 Z" 
          fill="none" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" />
    
    <!-- Roof outline overlay -->
    <path d="M5 165 L120 60 L235 165" 
          fill="none" stroke="#22c55e" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

    <!-- Interior Solar Cells Grid -->
    <rect x="60" y="150" width="40" height="30" rx="4" fill="#6366f1" opacity="0.9" stroke="#ffffff" stroke-width="4"/>
    <rect x="140" y="150" width="40" height="30" rx="4" fill="#6366f1" opacity="0.9" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Heavy Duty Yellow Construction Helmet on Top of House -->
    <g transform="translate(48, -45)">
      <!-- Main dome of safety helmet -->
      <path d="M10 70 C10 30, 134 30, 134 70 Z" fill="url(#helmetGrad)" />
      <!-- Helmet visor -->
      <path d="M0 70 L144 70 L140 76 L4 76 Z" fill="#d97706" rx="2" />
      <!-- Top ridge line of the helmet -->
      <path d="M62 34 C67 30, 77 30, 82 34 L82 70 L62 70 Z" fill="#fbb001" opacity="0.8" />
    </g>
  </g>

  <!-- Subtle high contrast border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />
</svg>
